tags: [appointments]
summary: Déposer un avis sur un rendez-vous
description: |
  Permet au client de déposer un avis sur un rendez-vous terminé.
  Un seul avis est autorisé par rendez-vous.
  Le rendez-vous doit être au statut `completed`.
consumes: [application/json]
produces: [application/json]
security:
  - BearerAuth: []
parameters:
  - in: path
    name: appointment_id
    type: integer
    required: true
    description: Identifiant du rendez-vous
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [rating]
      properties:
        rating:  { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, maxLength: 2000, nullable: true, example: "Excellente prestataire !" }
responses:
  201:
    description: Avis déposé
    schema:
      $ref: '#/definitions/ReviewResponse'
  400:
    description: Le rendez-vous n'est pas terminé ou données invalides
    schema:
      $ref: '#/definitions/ErrorBadRequestResponse'
  401:
    description: Non authentifié
    schema:
      $ref: '#/definitions/ErrorUnauthorizedResponse'
  403:
    description: Accès refusé (pas le client du rendez-vous)
    schema:
      $ref: '#/definitions/ErrorForbiddenResponse'
  404:
    description: Rendez-vous introuvable
    schema:
      $ref: '#/definitions/ErrorNotFoundResponse'
  409:
    description: Un avis existe déjà pour ce rendez-vous
    schema:
      $ref: '#/definitions/ErrorConflictResponse'
  500:
    description: Erreur interne du serveur
    schema:
      $ref: '#/definitions/ErrorResponse'

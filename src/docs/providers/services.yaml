tags: [providers]
summary: Lister les prestations d'un prestataire
description: Retourne la liste paginée des prestations proposées par un prestataire.
produces: [application/json]
parameters:
  - in: path
    name: provider_id
    type: integer
    required: true
    description: Identifiant du prestataire
  - in: query
    name: page
    type: integer
    default: 1
  - in: query
    name: limit
    type: integer
    default: 20
responses:
  200:
    description: Liste paginée des prestations
    schema:
      allOf:
        - $ref: '#/definitions/PaginatedResponse'
        - properties:
            items:
              type: array
              items:
                $ref: '#/definitions/ServiceResponse'
  404:
    description: Prestataire introuvable
    schema:
      $ref: '#/definitions/ErrorNotFoundResponse'
  500:
    description: Erreur interne du serveur
    schema:
      $ref: '#/definitions/ErrorResponse'

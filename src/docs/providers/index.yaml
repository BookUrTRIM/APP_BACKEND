tags: [providers]
summary: Lister les prestataires
description: Retourne la liste paginée de tous les prestataires.
produces: [application/json]
parameters:
  - in: query
    name: page
    type: integer
    default: 1
    description: Numéro de page
  - in: query
    name: limit
    type: integer
    default: 20
    description: Nombre de résultats par page
responses:
  200:
    description: Liste paginée des prestataires
    schema:
      allOf:
        - $ref: '#/definitions/PaginatedResponse'
        - properties:
            items:
              type: array
              items:
                $ref: '#/definitions/ProviderResponse'
  500:
    description: Erreur interne du serveur
    schema:
      $ref: '#/definitions/ErrorResponse'

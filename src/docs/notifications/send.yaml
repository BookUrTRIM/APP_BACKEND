tags: [notifications]
summary: Envoyer une notification
description: |
  Crée et envoie une notification liée à un rendez-vous.
  Le statut passe automatiquement à `sent` ou `failed` selon le résultat de l'envoi.
consumes: [application/json]
produces: [application/json]
security:
  - BearerAuth: []
parameters:
  - in: path
    name: appointment_id
    type: integer
    required: true
    description: Identifiant du rendez-vous
  - in: body
    name: body
    required: true
    schema:
      $ref: '#/definitions/NotificationSendDTO'
responses:
  201:
    description: Notification envoyée
    schema:
      $ref: '#/definitions/NotificationResponse'
  400:
    description: Données invalides
    schema:
      $ref: '#/definitions/ErrorBadRequestResponse'
  401:
    description: Non authentifié
    schema:
      $ref: '#/definitions/ErrorUnauthorizedResponse'
  500:
    description: Échec d'envoi de la notification
    schema:
      $ref: '#/definitions/ErrorResponse'
